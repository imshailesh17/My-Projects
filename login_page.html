<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .card{
            background-color: #797676;
            border-radius: 8px;
            padding: 30px;
            width: 300px;

        }
        h2{
            color: #3663d3;
            text-align: center;
            margin-bottom: 20px;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        input{
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            background-color: #ede3e3;
            border: 1px solid black;
        }
        button{
            background-color: #1b81da;
            color: #ffff;
            padding: 10px;
            border-radius: 8px;
        }
        button:hover{
            background-color: #10178f;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form action="">

            <input type="email" id="username" class="username" placeholder="Enter your E-mail">
            <input type="password" name="password" id="password" placeholder="Enter your password" class="password">
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
